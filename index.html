function instrument(src){
  const ast=acorn.parse(src,{ecmaVersion:"latest",locations:true,allowAwaitOutsideFunction:true,allowReturnOutsideFunction:true});
  const walk=(n,f)=>{if(Array.isArray(n)){n.forEach(c=>walk(c,f));return}if(!n||typeof n.type!=="string")return;f(n);for(const k in n){const v=n[k];if(v&&typeof v==="object"&&k!=="loc")walk(v,f)}};
  const names=new Set(),FN=/^(FunctionDeclaration|FunctionExpression|ArrowFunctionExpression)$/;
  walk(ast,n=>{
    if(n.type==="VariableDeclarator"&&n.id.type==="Identifier")names.add(n.id.name);
    if(FN.test(n.type))n.params.forEach(p=>p.type==="Identifier"&&names.add(p.name));
  });
  const snap=ns=>"["+[...ns].map(k=>`["${k}",()=>${k}]`).join(",")+"]";
  const ins=[],LB={ForStatement:"for",ForInStatement:"for-in",ForOfStatement:"for-of",WhileStatement:"while",DoWhileStatement:"do-while"};
  walk(ast,n=>{
    let b,kind,label,ns=names;
    if(LB[n.type]){b=n.body;kind="loop";label=LB[n.type]}
    else if(FN.test(n.type)&&n.body.type==="BlockStatement"){b=n.body;kind="fn";label=(n.id&&n.id.name)||"anonymous";ns=n.params.filter(p=>p.type==="Identifier").map(p=>p.name)}
    if(!b)return;
    const pre=`__t("${kind}","${label}",${n.loc.start.line},${snap(ns)});try{`,suf="}finally{__x()}";
    if(b.type==="BlockStatement")ins.push([b.start+1,pre],[b.end-1,suf]);
    else ins.push([b.start,"{"+pre],[b.end,suf+"}"]);
  });
  let s=src;
  ins.map((x,i)=>[x[0],x[1],i]).sort((a,b)=>b[0]-a[0]||a[2]-b[2]).forEach(([p,t])=>{s=s.slice(0,p)+t+s.slice(p)});
  return s;
}
